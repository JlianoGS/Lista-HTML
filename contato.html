<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contato</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    form div {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
    <nav>
    <ul>
      <li><a href="index.html">Voltar para o inicio</a></li>
      <li><a href="historia_web.html">História da WEB</a></li>
      <li><a href="http.html">HTTP</a></li>
      <li><a href="curriculo.html">Voltar para o currículo</a></li>
    </ul>
  </nav>

  <hr>

  <h1>Contato</h1>
  <p>
    Instruções: preencha os campos obrigatórios (marcados com *) e escreva sua mensagem abaixo. Como o formulário ainda não está conectado a um servidor, o envio é apenas visual no navegador.
  </p>

  <form action="#" method="post">
    <div>
      <label for="nome">Nome *</label>
      <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
    </div>

    <div>
      <label for="email">E-mail *</label>
      <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
    </div>

    <div>
      <label for="telefone">Telefone (opcional)</label>
      <input type="number" id="telefone" name="telefone" placeholder="11999998888">
    </div>

    <div>
      <label for="assunto">Assunto</label>
      <input type="text" id="assunto" name="assunto" placeholder="Ex.: Dúvida, projeto ou contato profissional">
    </div>

    <div>
      <label for="estado">Estado</label>
      <select id="estado" name="estado">
        <option value="">Selecione um estado</option>
        <option value="AC">Acre</option>
        <option value="AL">Alagoas</option>
        <option value="AP">Amapá</option>
        <option value="AM">Amazonas</option>
        <option value="BA">Bahia</option>
        <option value="CE">Ceará</option>
        <option value="DF">Distrito Federal</option>
        <option value="ES">Espírito Santo</option>
        <option value="GO">Goiás</option>
        <option value="MA">Maranhão</option>
        <option value="MT">Mato Grosso</option>
        <option value="MS">Mato Grosso do Sul</option>
        <option value="MG">Minas Gerais</option>
        <option value="PA">Pará</option>
        <option value="PB">Paraíba</option>
        <option value="PR">Paraná</option>
        <option value="PE">Pernambuco</option>
        <option value="PI">Piauí</option>
        <option value="RJ">Rio de Janeiro</option>
        <option value="RN">Rio Grande do Norte</option>
        <option value="RS">Rio Grande do Sul</option>
        <option value="RO">Rondônia</option>
        <option value="RR">Roraima</option>
        <option value="SC">Santa Catarina</option>
        <option value="SP">São Paulo</option>
        <option value="SE">Sergipe</option>
        <option value="TO">Tocantins</option>
      </select>
    </div>

    <div>
      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" rows="5" cols="40" placeholder="Escreva sua mensagem aqui..."></textarea>
    </div>

    <button type="submit">Enviar</button>
  </form>

</body>
</html>
